services:
  app:
    build: .
    init: true
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/predictions.db}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      SESSION_SECRET_KEY: "${SESSION_SECRET_KEY:?Set SESSION_SECRET_KEY in .env}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}"
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - predictions_data:/data
    restart: unless-stopped

  fixture-worker:
    build: .
    command: ["python", "-m", "app.fixture_scheduler"]
    profiles: ["fixture-sync"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/predictions.db}
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - predictions_data:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  predictions_data:

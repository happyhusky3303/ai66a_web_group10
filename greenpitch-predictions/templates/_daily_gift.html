<dialog id="daily-gift-dialog" class="daily-gift-dialog" aria-labelledby="daily-gift-title">
  <form method="dialog">
    <button class="button button-quiet daily-gift-close" aria-label="Close daily gift" autofocus>×</button>
  </form>
  <span class="daily-gift-icon" aria-hidden="true">🎁</span>
  <h2 id="daily-gift-title">Daily gift</h2>
  <p id="daily-gift-description" class="muted"></p>
  <p class="daily-gift-balance"><span class="muted">Your points</span><strong id="daily-gift-points" class="mono"></strong></p>
  <button id="daily-gift-claim" class="button button-primary daily-gift-claim" type="button">Claim</button>
  <p id="daily-gift-status" class="muted" role="status"></p>
</dialog>
